[project]
name = "canvas-mcp"
version = "1.0.0"
description = "MCP server that connects Claude (or any MCP client) to your Canvas LMS account"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0,<2", "httpx>=0.27.0", "pypdf>=4.0.0"]

[project.scripts]
canvas-mcp = "canvas_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["canvas_mcp.py", "sandbox_runner.js"]
